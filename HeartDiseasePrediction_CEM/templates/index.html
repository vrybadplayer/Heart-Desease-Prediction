<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>💓 Heart Disease Prediction</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f7f9fc;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #d6336c;
    }

    label {
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    input[type="submit"],
    button {
      background: #d6336c;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 10px 15px;
      border-radius: 5px;
      margin-right: 10px;
    }

    input[type="submit"]:hover,
    button:hover {
      background: #c8235a;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      background-color: #f0f9ff;
      border-left: 5px solid #17a2b8;
    }

    .error {
      border-left: 5px solid #dc3545;
      background-color: #fff5f5;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>💓 Heart Disease Prediction</h2>

    <form action="/predict" method="post" id="predictionForm">
      <label>Age:</label>
      <input type="number" name="age" id="age" min="1" max="150" required>

      <label>Sex:</label>
      <select name="sex" id="sex">
        <option value="0">Female</option>
        <option value="1">Male</option>
      </select>

      <label>Chest Pain Type:</label>
      <select name="chest_pain_type" id="chest_pain_type">
        <option value="1">Type 1</option>
        <option value="2">Type 2</option>
        <option value="3">Type 3</option>
        <option value="4">Type 4</option>
      </select>

      <label>Resting BP (mm Hg):</label>
      <input type="number" name="resting_bp_s" id="resting_bp_s" min="60" max="220" required>

      <label>Cholesterol (mg/dL):</label>
      <input type="number" name="cholesterol" id="cholesterol" min="0" max="600" required>

      <label>Fasting Blood Sugar > 120:</label>
      <select name="fasting_blood_sugar" id="fasting_blood_sugar">
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>

      <label>Max Heart Rate:</label>
      <input type="number" name="max_heart_rate" id="max_heart_rate" min="50" max="220" required>

      <label>Exercise-Induced Angina:</label>
      <select name="exercise_angina" id="exercise_angina">
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>

      <label>Oldpeak (ST depression):</label>
      <input type="number" step="0.1" name="oldpeak" id="oldpeak" min="0" max="6" required>

      <label>ST Slope:</label>
      <select name="ST_slope" id="ST_slope">
        <option value="1">1 – Downsloping</option>
        <option value="2">2 – Flat</option>
        <option value="3">3 – Upsloping</option>
      </select>

      <button type="button" onclick="fillRandom()">🔁 Random Input</button>
      <input type="submit" value="🔍 Predict">
    </form>

    {% if prediction %}
    <div class="result {% if '❌' in prediction %}error{% endif %}">
      <h3>🔮 Prediction: {{ prediction }}</h3>
      <p>📊 Probability: <strong>{{ probability }}</strong></p>
    </div>
    {% endif %}
  </div>

  <!-- Scripts for Random + Save + Restore -->
  <script>
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    }

    function randomFloat(min, max, step = 0.1) {
      const precision = 1 / step;
      return (Math.floor(Math.random() * ((max - min) * precision + 1)) / precision).toFixed(1);
    }

    function fillRandom() {
      document.getElementById('age').value = randomInt(15, 110);
      document.getElementById('sex').value = randomInt(0, 1);
      document.getElementById('chest_pain_type').value = randomInt(1, 4);
      document.getElementById('resting_bp_s').value = randomInt(80, 200);
      document.getElementById('cholesterol').value = randomInt(80, 550);
      document.getElementById('fasting_blood_sugar').value = randomInt(0, 1);
      document.getElementById('max_heart_rate').value = randomInt(60, 210);
      document.getElementById('exercise_angina').value = randomInt(0, 1);
      document.getElementById('oldpeak').value = randomFloat(0, 6);
      document.getElementById('ST_slope').value = randomInt(1, 3);
    }

    // Store values on submit
    document.getElementById('predictionForm').addEventListener('submit', () => {
      const ids = [
        'age', 'sex', 'chest_pain_type', 'resting_bp_s', 'cholesterol',
        'fasting_blood_sugar', 'max_heart_rate',
        'exercise_angina', 'oldpeak', 'ST_slope'
      ];
      ids.forEach(id => {
        localStorage.setItem('heartForm_' + id, document.getElementById(id).value);
      });
    });

    // Restore values on page load
    window.onload = () => {
      const ids = [
        'age', 'sex', 'chest_pain_type', 'resting_bp_s', 'cholesterol',
        'fasting_blood_sugar', 'max_heart_rate',
        'exercise_angina', 'oldpeak', 'ST_slope'
      ];
      ids.forEach(id => {
        const val = localStorage.getItem('heartForm_' + id);
        if (val !== null) document.getElementById(id).value = val;
      });
    };
  </script>

</body>

</html>
